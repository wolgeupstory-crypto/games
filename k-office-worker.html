function fresh(){return {day:1,money:3,mental:3,reputation:3,rescueUsed:false,rescuePending:null,rescueResult:false,counts:{},recent:[],eventCount:0,flags:{},pending:[],story:null,storyStage:0,storyCooldown:0,investmentCount:0,investmentSuccess:0,lottoBought:false,traits:{money:0,mental:0,reputation:0},lastMoneyLoss:false,ending:false,current:null};}

function dots(v){return '●'.repeat(v)+'○'.repeat(5-v);}

function add(e){for(const[k,v]of Object.entries(e||{}))s[k]=clamp(s[k]+v);}
function count(id){return s.counts[id]||0;}
function can(id){let e=E[id];return !e.condition||e.condition(s);}
function recentFresh(id){return !s.recent.slice(-5).includes(id);}

function endingFor(k){if(k==='failure')return['더는 못 버텨','돈도 챙겨야 하고,\n멘탈도 챙겨야 하고,\n회사에서의 평판도 신경 써야 한다.\n\n직장생활, 생각보다 쉽지 않다.'];if(k==='lotto')return['인생 역전','그냥 재미로 한 장 샀다.\n\n그런데 1등이었다.\n\n월요일 출근? 이제 진지하게 고민해봐야겠다.'];if(k==='investment')return['나 투자 천재인가?','처음엔 그냥 조금 넣어봤다.\n\n그런데 올랐다.\n한 번 더 넣었는데 또 올랐다.\n\n나 투자 천재인가?'];if(k==='headhunter')return['나를 알아보는 회사','면접 결과가 나왔다.\n\n합격했다.\n\n"이런 사람을 찾고 있었어요."\n\n역시, 알아보는 사람은 알아보는구나.'];let hi=v=>v>=4;let a=hi(s.money),b=hi(s.mental),c=hi(s.reputation);if(!a&&!b&&!c)return['오늘도 출근','돈도 많이 모으지 못했다.\n회사에서도 딱히 인정받지는 못했다.\n멘탈도 그럭저럭 버티는 정도다.\n\n그래도 월요일 아침은 온다.\n오늘도 출근한다.'];if(a&&!b&&!c)return['통장은 튼튼','회사는 여전히 힘들다.\n특별히 인정받는 것도 아니다.\n\n그래도 통장을 보면 조금 안심된다.\n퇴사하기엔 통장이 너무 튼튼하다.'];if(!a&&b&&!c)return['정신승리 만렙','돈은 많이 모으지 못했다.\n회사에서 크게 인정받지도 못했다.\n\n그런데 이상하게 멘탈은 멀쩡하다.\n이 정도면 나름 잘 살고 있는 거 아닐까?'];if(!a&&!b&&c)return['회사에 뼈를 묻음','돈도 많이 모으지 못했다.\n멘탈도 꽤 깎였다.\n\n그래도 회사에서는 인정받았다.\n이쯤 되면 그냥 여기서 뼈를 묻는 건가.'];if(a&&b&&!c)return['부업부터 해볼까','돈도 어느 정도 모았다.\n회사에서 받는 스트레스도 잘 관리했다.\n\n이제 회사 말고 다른 것도 해볼 수 있을 것 같다.\n일단 부업부터 해볼까?'];if(a&&!b&&c)return['회사에서는 인정받음','돈도 모았고 회사에서도 인정받았다.\n남들이 보기엔 꽤 괜찮은 직장생활이다.\n\n그런데 요즘은 출근하는 게 조금씩 힘들다.'];if(!a&&b&&c)return['다음 기회를 기다리며','돈은 아직 많이 모으지 못했다.\n그래도 회사에서 쌓은 것도 있고, 멘탈도 괜찮다.\n\n조금 더 준비해서 다음 기회를 기다려보기로 했다.'];return['퇴사는 선택, 출근은 취미','돈도 모았다.\n회사에서도 인정받았다.\n멘탈도 잘 챙겼다.\n\n이제는 퇴사해도 괜찮고, 계속 다녀도 괜찮다.\n\n퇴사는 선택, 출근은 취미.'];}
function getPlaystyle(){let c=s.traits,m=Math.max(c.money,c.mental,c.reputation);let w=Object.entries(c).filter(([,v])=>v===m).map(([k])=>k);if(w.length!==1)return['균형형','돈, 멘탈, 평판을 어느 한쪽에만 치우치지 않고 선택했다.'];let map={money:['돈 우선형','기회가 보이면 돈을 챙기는 선택을 많이 했다.'],mental:['멘탈 우선형','무리하지 않고 내 상태를 먼저 챙기는 선택을 많이 했다.'],reputation:['평판 우선형','회사에서의 평판을 중요하게 생각하는 선택을 많이 했다.']};return map[w[0]];}
next.onclick=()=>{s.rescueResult=false;show();};restart.onclick=()=>{s=fresh();show();};again.onclick=()=>{s=fresh();show();};share.onclick=async()=>{let t=getPlaystyle();let txt=`K-직장인 결과\n엔딩: ${endingTitle.textContent}\n돈 ${s.money}/5 · 멘탈 ${s.mental}/5 · 평판 ${s.reputation}/5\n플레이 성향: ${t[0]}`;try{if(navigator.share)await navigator.share({title:'K-직장인 결과',text:txt});else{await navigator.clipboard.writeText(txt);share.textContent='복사됐어요';}}catch(e){}};
render();show();
</script></body></html>
